<!-- Mobile Menu -->
<div class="mobile-overlay" id="mobile-overlay"></div>
<div class="mobile-menu" id="mobile-menu">
  <a href="/" class="mobile-nav-link">Home</a>
  <div style="padding:0.5rem 0;font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Career Stage</div>
  <a href="{{ '/students/' | relative_url }}" class="mobile-nav-link" style="padding-left:1rem;">Medical Students</a>
  <a href="{{ '/residents/' | relative_url }}" class="mobile-nav-link" style="padding-left:1rem;">Residents</a>
  <a href="{{ '/attendings/' | relative_url }}" class="mobile-nav-link" style="padding-left:1rem;">Attendings</a>

  <a href="{{ '/blog/' | relative_url }}" class="mobile-nav-link">Blog</a>
  <a href="{{ '/support/' | relative_url }}" class="mobile-nav-link">Support</a>
</div>

<script>
(function(){
  var btn = document.getElementById('hamburger-btn');
  var menu = document.getElementById('mobile-menu');
  var overlay = document.getElementById('mobile-overlay');
  if (!btn || !menu) return;
  function toggle() {
    menu.classList.toggle('open');
    overlay.classList.toggle('open');
    document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
  }
  btn.addEventListener('click', toggle);
  overlay.addEventListener('click', toggle);
  menu.querySelectorAll('.mobile-nav-link').forEach(function(link) {
    link.addEventListener('click', function() { if (menu.classList.contains('open')) toggle(); });
  });
})();
</script>
