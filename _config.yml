# RVU Edge Website
title: RVU Edge - RVU & Case Tracker
description: "The fastest wRVU tracker for physicians. One-tap rapid CPT code entry, specialty benchmarks, goal tracking. Built by a fighter pilot for his surgeon wife."
url: "https://rvuedge.com"
baseurl: ""

# Author
author:
  name: Nicholas Len
  email: support@rvuedge.com

# Build settings
markdown: kramdown
permalink: /blog/:title/

# Plugins (natively supported by GitHub Pages)
plugins:
  - jekyll-seo-tag

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      last_modified_at: "2026-03-04"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Nicholas Len"

# Exclude from build
exclude:
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock

